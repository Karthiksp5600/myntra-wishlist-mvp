<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Myntra Wishlist Verdict</title><style>body{margin:0;background:#f7f7f7;color:#282c3f;font:16px Arial,sans-serif}header{padding:36px 7%;background:#fff}h1{margin:0;font-size:32px}.sub{color:#6b6f7c;margin:8px 0 0}main{max-width:1180px;margin:28px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card,.panel{background:#fff;border:1px solid #eaeaec;border-radius:14px;overflow:hidden}.card img{width:100%;height:250px;object-fit:cover}.card div{padding:16px}.brand{color:#7e818c;font-size:13px}button{border:0;border-radius:8px;padding:11px 14px;background:#ff3f6c;color:#fff;font-weight:bold;cursor:pointer;margin:4px 4px 0 0}.secondary{background:#eef0f4;color:#282c3f}.panel{padding:22px;margin:20px 0}.hidden{display:none}.score{font-size:30px;font-weight:bold;color:#ff3f6c}.pill{display:inline-block;background:#fff0f3;color:#d92d58;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:bold}ul{padding-left:18px}@media(max-width:600px){header{padding:24px 20px}h1{font-size:26px}}</style></head><body><header><h1>Myntra Wishlist Verdict</h1><p class="sub">Maturation Layer MVP: turn saved-item uncertainty into purchase confidence.</p></header><main><div id="detail" class="hidden"></div><h2>Saved for later</h2><div id="products" class="grid"></div><div class="panel"><h2>MVP analytics</h2><div id="analytics">Loading...</div></div></main><script>const el=id=>document.getElementById(id);const api=path=>fetch('/api/'+path).then(r=>r.json());async function event(product_id,event_name){await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_id,event_name})});analytics()}async function analytics(){let a=await api('analytics');el('analytics').textContent=`Verdict views: ${a.verdict_views} | Add to cart: ${a.add_to_cart} | Buy now: ${a.buy_now} | Comparisons: ${a.comparisons}`}async function show(id){let d=await api('products/'+id),p=d.product,c=d.case_file;await event(id,'verdict_viewed');el('detail').className='panel';el('detail').innerHTML=`<button class="secondary" onclick="closeDetail()">Back to wishlist</button><h2>${p.name}</h2><p class="brand">${p.brand} · ${p.category} · Rs. ${p.price}</p><span class="pill">${c.label}</span><p class="score">${c.score}% confidence</p><h3>${c.hesitation}</h3><p>${c.explanation}</p><h3>Decision now</h3><p>${c.recommended_action}</p><button onclick="event('${p.id}','add_to_cart');alert('Added to cart')">Add to Cart</button><button onclick="event('${p.id}','buy_now');alert('Buy-now flow started')">Buy Now</button><button class="secondary" onclick="compare('${p.id}')">Compare options</button><h3>Evidence</h3><ul>${p.reviews.map(x=>`<li>${x}</li>`).join('')}</ul><h3>Watch-outs</h3><ul>${c.watch_outs.map(x=>`<li>${x}</li>`).join('')}</ul>`;window.scrollTo({top:0,behavior:'smooth'})}function closeDetail(){el('detail').className='hidden'}async function compare(id){await event(id,'comparison_opened');let d=await api('compare/'+id);el('detail').className='panel';el('detail').innerHTML=`<button class="secondary" onclick="closeDetail()">Back to wishlist</button><h2>Comparison resolution</h2><p class="score">Choose ${d.winner.name}</p><p>${d.winner_score}% confidence versus ${d.loser_score}%</p><p>Why: ${d.reason}.</p><button onclick="event('${d.winner.id}','add_to_cart');alert('Added to cart')">Add ${d.winner.name} to Cart</button><button class="secondary" onclick="show('${d.winner.id}')">Open verdict</button>`;window.scrollTo({top:0,behavior:'smooth'})}async function init(){let items=await api('products');el('products').innerHTML=items.map(p=>`<article class="card"><img src="${p.image}" alt="${p.name}"><div><strong>${p.name}</strong><p class="brand">${p.brand} · Rs. ${p.price}</p><button onclick="show('${p.id}')">View verdict</button></div></article>`).join('');analytics()}init()</script></body></html>
