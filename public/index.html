<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Myntra Wishlist Verdict</title>
<style>
body{margin:0;background:#f7f7f7;color:#282c3f;font:16px Arial,sans-serif}header{padding:36px 7%;background:#fff}h1{margin:0;font-size:32px}.sub,.brand{color:#6b6f7c}.sub{margin:8px 0 0}.brand{font-size:13px}main{max-width:1180px;margin:28px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card,.panel{background:#fff;border:1px solid #eaeaec;border-radius:14px;overflow:hidden}.card img{width:100%;height:250px;object-fit:cover}.card div{padding:16px}.panel{padding:22px;margin:20px 0}.hidden{display:none}.score{font-size:30px;font-weight:bold;color:#ff3f6c}.pill{display:inline-block;background:#fff0f3;color:#d92d58;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:bold}button{border:0;border-radius:8px;padding:11px 14px;background:#ff3f6c;color:#fff;font-weight:bold;cursor:pointer;margin:4px 4px 0 0}.secondary{background:#eef0f4;color:#282c3f}.save{background:#fff0f3;color:#d92d58}.saved{color:#07824a;font-weight:bold;font-size:13px}ul{padding-left:18px}.overlay{position:fixed;inset:0;background:rgba(40,44,63,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:4}.modal{max-width:520px;background:#fff;border-radius:16px;padding:26px;box-shadow:0 18px 50px rgba(0,0,0,.2)}.nudge{border-left:5px solid #ff3f6c;background:#fff6f8;padding:14px;border-radius:8px;margin:14px 0}.nudge h3{margin:0 0 7px}@media(max-width:600px){header{padding:24px 20px}h1{font-size:26px}}
</style></head><body><header><h1>Myntra Wishlist Verdict</h1><p class="sub">Maturation Layer MVP: turn saved-item uncertainty into purchase confidence.</p></header>
<main><div id="detail" class="hidden"></div><h2>Wishlist</h2><p class="sub">Save an item to see the decision nudge when a close alternative is already saved.</p><div id="products" class="grid"></div><div class="panel"><h2>MVP analytics</h2><div id="analytics">Loading...</div></div></main><div id="modal" class="hidden"></div>
<script>
const el=id=>document.getElementById(id),api=path=>fetch('/api/'+path).then(r=>r.json());let items=[];
const saved=()=>JSON.parse(localStorage.getItem('myntra-saved')||'["MYN-008"]');const setSaved=value=>localStorage.setItem('myntra-saved',JSON.stringify(value));
async function event(product_id,event_name,metadata={}){await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_id,event_name,metadata})});analytics()}
async function analytics(){let a=await api('analytics');el('analytics').textContent=`Verdict views: ${a.verdict_views} | Add to cart: ${a.add_to_cart} | Buy now: ${a.buy_now} | Comparisons: ${a.comparisons}`}
function candidateFor(product){return items.find(x=>x.id===product.comparison_target_id)||items.find(x=>x.id!==product.id&&(x.comparison_group||x.category)===(product.comparison_group||product.category))}
function renderProducts(){let ids=saved();el('products').innerHTML=items.map(p=>`<article class="card"><img src="${p.image}" alt="${p.name}"><div><strong>${p.name}</strong><p class="brand">${p.brand} · Rs. ${p.price}</p>${ids.includes(p.id)?'<p class="saved">Saved to wishlist</p>':`<button class="save" onclick="save('${p.id}')">Save to wishlist</button>`}<button class="secondary" onclick="show('${p.id}')">Open verdict</button></div></article>`).join('')}
async function save(id){let p=items.find(x=>x.id===id),ids=saved();if(!ids.includes(id))setSaved([...ids,id]);let candidate=candidateFor(p);await event(id,'wishlist_saved',{candidate_id:candidate&&saved().includes(candidate.id)?candidate.id:null});renderProducts();if(candidate&&saved().includes(candidate.id)){await event(id,'decision_nudge_shown',{candidate_id:candidate.id});nudge(p,candidate)}}
function nudge(product,candidate){el('modal').className='overlay';el('modal').innerHTML=`<section class="modal"><div class="nudge"><h3>You already saved a similar item</h3><p><strong>${candidate.name}</strong> is already in your wishlist. Compare now to make a choice, remove the alternative, or keep both for later.</p></div><p class="brand">This nudge appears at the moment of saving, before the decision is deferred.</p><button onclick="nudgeCompare('${product.id}')">Compare saved items</button><button class="secondary" onclick="removeAlternative('${product.id}','${candidate.id}')">Remove ${candidate.name}</button><button class="secondary" onclick="keepBoth('${product.id}','${candidate.id}')">Keep both for now</button></section>`}
function closeModal(){el('modal').className='hidden';el('modal').innerHTML=''}async function nudgeCompare(id){let candidate=candidateFor(items.find(x=>x.id===id));await event(id,'decision_nudge_comparison_opened',{candidate_id:candidate.id});closeModal();compare(id)}async function removeAlternative(source,id){setSaved(saved().filter(x=>x!==id));await event(source,'decision_nudge_discarded',{discarded_product_id:id,source:'save_nudge'});closeModal();renderProducts()}async function keepBoth(source,id){await event(source,'decision_nudge_deferred',{candidate_id:id});closeModal()}
async function show(id){let d=await api('products/'+id),p=d.product,c=d.case_file;await event(id,'verdict_viewed');el('detail').className='panel';el('detail').innerHTML=`<button class="secondary" onclick="closeDetail()">Back to wishlist</button><h2>${p.name}</h2><p class="brand">${p.brand} · ${p.category} · Rs. ${p.price}</p><span class="pill">${c.label}</span><p class="score">${c.score}% confidence</p><h3>${c.hesitation}</h3><p>${c.explanation}</p><h3>Decision now</h3><p>${c.recommended_action}</p>${saved().includes(p.id)?'<p class="saved">Saved to wishlist</p>':`<button class="save" onclick="save('${p.id}')">Save to wishlist</button>`}<button onclick="event('${p.id}','add_to_cart');alert('Added to cart')">Add to Cart</button><button onclick="event('${p.id}','buy_now');alert('Buy-now flow started')">Buy Now</button><button class="secondary" onclick="compare('${p.id}')">Compare options</button><h3>Evidence</h3><ul>${p.reviews.map(x=>`<li>${x}</li>`).join('')}</ul><h3>Watch-outs</h3><ul>${c.watch_outs.map(x=>`<li>${x}</li>`).join('')}</ul>`;window.scrollTo({top:0,behavior:'smooth'})}
function closeDetail(){el('detail').className='hidden'}async function compare(id){await event(id,'comparison_opened');let d=await api('compare/'+id);el('detail').className='panel';el('detail').innerHTML=`<button class="secondary" onclick="closeDetail()">Back to wishlist</button><h2>Comparison resolution</h2><p class="score">Choose ${d.winner.name}</p><p>${d.winner_score}% confidence versus ${d.loser_score}%</p><p>Why: ${d.reason}.</p><button onclick="event('${d.winner.id}','add_to_cart');alert('Added to cart')">Add ${d.winner.name} to Cart</button><button class="secondary" onclick="show('${d.winner.id}')">Open verdict</button>`;window.scrollTo({top:0,behavior:'smooth'})}
async function init(){items=await api('products');renderProducts();analytics()}init();
</script></body></html>
